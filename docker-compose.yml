services:
  chickadee:
    build: .
    restart: unless-stopped
    environment:
      # ── Required ──────────────────────────────────────────────────────
      - CHICKADEE_TELEGRAM_BOT_TOKEN=${CHICKADEE_TELEGRAM_BOT_TOKEN}
      # ── Telegram access control (* = open, or comma-separated chat IDs)
      - CHICKADEE_ALLOWED_CHAT_IDS=${CHICKADEE_ALLOWED_CHAT_IDS:-*}
      # ── Telegram webhook (optional)
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # ── LM Studio (laptop, primary when available) ───────────────────
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://localhost:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-gemma-4-e4b-it}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-}
      # ── Free pool providers ──────────────────────────────────────────
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODELS=gemini-2.5-flash
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODELS=gemma4:31b
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODELS=mistral-small-latest
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_FREE_MODELS=google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free
      # ── OpenRouter paid (final fallback when all free models fail) ──
      - OPENROUTER_PAID_MODELS=openai/gpt-5-nano,deepseek/deepseek-v3.2,openai/gpt-4o-mini
      # ── Transcription (YouTube audio -> text via OpenRouter) ─────────
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-xiaomi/mimo-v2.5}
    volumes:
      - ./vault:/app/vault
      - ./cookies.txt:/app/cookies.txt:ro  # YouTube cookies (export from browser)
