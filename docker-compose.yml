services:
  chickadee:
    build: .
    restart: unless-stopped
    environment:
      # ── Required ──────────────────────────────────────────────────────
      - CHICKADEE_TELEGRAM_BOT_TOKEN=${CHICKADEE_TELEGRAM_BOT_TOKEN}
      # ── Telegram access control (* = open, or comma-separated chat IDs)
      - BOT_ALLOWED_CHAT_IDS=${BOT_ALLOWED_CHAT_IDS:-*}
      # ── Telegram webhook (optional)
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # ── LM Studio (laptop, primary when available) ───────────────────
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://localhost:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-gemma-4-e4b-it}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-}
      # ── Vercel AI Gateway (paid, reliable fallback) ──────────────────
      - VERCEL_AI_GATEWAY_API_KEY=${VERCEL_AI_GATEWAY_API_KEY:-}
      - VERCEL_PAID_MODEL=${VERCEL_PAID_MODEL:-openai/gpt-oss-20b}
      # ── Free pool providers ──────────────────────────────────────────
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-gemma4:31b,gpt-oss:20b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODELS=${GROQ_MODELS:-openai/gpt-oss-120b}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - CEREBRAS_MODELS=${CEREBRAS_MODELS:-gpt-oss-120b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_FREE_MODELS=${OPENROUTER_FREE_MODELS:-google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,openai/gpt-oss-20b:free,openai/gpt-oss-120b:free}
      # ── Transcription (YouTube audio -> text via OpenRouter) ─────────
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-xiaomi/mimo-v2.5}
      # ── Vault ────────────────────────────────────────────────────────
      - VAULT_BACKEND=${VAULT_BACKEND:-obsidian}
      - VAULT_PATH=${VAULT_PATH:-/tmp/chickadee-vault}
    volumes:
      - /home/dushyant/code/chickadee/vault:/app/vault
